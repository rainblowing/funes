# P3.17 — CI for outsiders. Three independent gates so a failure names its own cause:
#   test     — lint:core (H7 edge-portability) + lint:dag (P3.14 acyclicity) + the suite
#   postgres — the LIVE profile-B smoke test, which skips locally without FUNES_PG_URL and so had
#              no standing coverage since PGLite was removed (2026-07-20). A pgvector service
#              container gives it a real cluster on every push.
#   secrets  — gitleaks over the full history (the repo is public)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # E5 embedder + real cross-encoder tests are excluded by the `test` script's name filter:
      # they download models from HF, which is not a CI-appropriate dependency.
      - run: bun run test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: postgres smoke (profile B)
        env:
          FUNES_PG_URL: postgres://postgres@localhost:5432/postgres
        run: bun test packages/funes-engine/src/postgres-smoke.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
